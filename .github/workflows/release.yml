# Publish KFM Companion.exe to GitHub Releases.
#
# Option 1 — push a version tag from the commit you want to ship:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Option 2 — GitHub → Actions → Release → Run workflow, enter v1.0.0
#   (uses the branch/commit you pick in the UI)
#
# Use vMAJOR.MINOR.PATCH (optional -beta / -rc.1 suffix).
# A hyphenated suffix (v1.0.0-beta) is published as a pre-release.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "${{ inputs.version }}"
          }
          $tag = "$tag".Trim()
          if (-not $tag) {
            throw "Set a version like v1.0.0 (git tag or workflow input)."
          }
          if ($tag -notmatch '^v') {
            $tag = "v$tag"
          }
          $numeric = $tag.Substring(1)
          if ($numeric -notmatch '^\d+\.\d+\.\d+') {
            throw "Version must look like v1.0.0 (got '$tag')."
          }
          $assembly = if ($numeric -match '^(\d+\.\d+\.\d+)') { "$($Matches[1]).0" } else { "$numeric.0" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$numeric" >> $env:GITHUB_OUTPUT
          "assembly=$assembly" >> $env:GITHUB_OUTPUT
          "prerelease=$($numeric -match '-')" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: >
          dotnet build SAM.Game/SAM.Game.csproj
          -c Release
          -p:Platform=x86
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly }}
          -p:FileVersion=${{ steps.version.outputs.assembly }}
          --verbosity minimal

      - name: Stage EXE
        shell: pwsh
        run: |
          $built = "upload\KFM Companion.exe"
          if (-not (Test-Path $built)) {
            throw "Expected '$built' after Release build."
          }
          $tag = "${{ steps.version.outputs.tag }}"
          $exeName = "KFM-Companion-$tag.exe"
          Copy-Item $built "upload\$exeName"
          Get-Item "upload\$exeName" | Select-Object Name, Length, LastWriteTime

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $exeName = "KFM-Companion-$tag.exe"
          $notesFile = "upload\release-notes.md"
          $notes = $null
          if (Test-Path CHANGELOG.md) {
            $raw = Get-Content CHANGELOG.md -Raw
            $pattern = "(?ms)^## $([regex]::Escape($tag))\s*\r?\n(.*?)(?=^## |\z)"
            $match = [regex]::Match($raw, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
            }
          }
          if (-not $notes) {
            $notes = "See the commits included in this tag."
          }
          $previous = $null
          try {
            $previous = gh release list --limit 1 --json tagName --jq ".[0].tagName"
          } catch {
          }
          if ($previous -and $previous -ne $tag) {
            $notes = $notes + "`n`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previous...$tag"
          }
          Set-Content -Path $notesFile -Value $notes -Encoding utf8NoBOM
          $ghArgs = @(
            "release", "create", $tag,
            "upload/$exeName#$exeName",
            "--title", "KFM Companion $tag",
            "--notes-file", $notesFile
          )
          if ("${{ github.ref_type }}" -ne "tag") {
            $ghArgs += @("--target", "${{ github.sha }}")
          }
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") {
            $ghArgs += "--prerelease"
          }
          gh @ghArgs

      - name: Rebuild download site
        env:
          HOOK: ${{ secrets.KFM_SITE_DEPLOY_HOOK }}
        shell: pwsh
        run: |
          if (-not $env:HOOK) {
            Write-Host "Skip site rebuild: set repo secret KFM_SITE_DEPLOY_HOOK to a Cloudflare Pages Deploy Hook URL."
            return
          }
          Invoke-RestMethod -Method Post -Uri $env:HOOK | Out-Null
          Write-Host "Triggered kfm-site rebuild."
